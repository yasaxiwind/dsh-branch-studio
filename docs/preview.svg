<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Parallel branches isolated in separate workspaces, compared side by side, then promoted">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4d6bfe"/>
      <stop offset="1" stop-color="#7c8cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="640" height="300" rx="14" fill="url(#bg)"/>
  <rect x="26" y="22" width="588" height="256" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- header -->
  <circle cx="48" cy="45" r="8" fill="url(#accent)"/>
  <rect x="64" y="39" width="88" height="10" rx="5" fill="#334155"/>
  <rect x="478" y="38" width="112" height="14" rx="7" fill="#e2e8f0"/>
  <line x1="26" y1="64" x2="614" y2="64" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- left source panel -->
  <rect x="44" y="80" width="148" height="178" rx="10" fill="#f8fafc" stroke="#dbe3ec"/>
  <rect x="58" y="94" width="74" height="9" rx="4.5" fill="#64748b"/>
  <rect x="58" y="116" width="118" height="26" rx="7" fill="#eef2ff" stroke="#c7d2fe"/>
  <rect x="66" y="125" width="52" height="7" rx="3.5" fill="#6366f1"/>
  <circle cx="70" cy="160" r="4" fill="#22c55e"/>
  <rect x="80" y="156" width="82" height="8" rx="4" fill="#cbd5e1"/>
  <circle cx="70" cy="181" r="4" fill="#3b82f6"/>
  <rect x="80" y="177" width="66" height="8" rx="4" fill="#cbd5e1"/>
  <circle cx="70" cy="202" r="4" fill="#f59e0b"/>
  <rect x="80" y="198" width="90" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="58" y="224" width="118" height="22" rx="7" fill="#4d6bfe"/>
  <rect x="91" y="232" width="52" height="6" rx="3" fill="#eef2ff" opacity="0.9"/>

  <!-- arrow fan-out -->
  <path d="M196 126 C220 126 222 104 246 104" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M196 158 C220 158 222 188 246 188" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M246 104 l-8 -4 v8 z" fill="#94a3b8"/>
  <path d="M246 188 l-8 -4 v8 z" fill="#94a3b8"/>

  <!-- branch A -->
  <g>
    <rect x="248" y="76" width="172" height="92" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="260" y="88" width="52" height="8" rx="4" fill="#64748b"/>
    <circle cx="398" cy="92" r="5" fill="#22c55e"/>
    <rect x="260" y="106" width="148" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="260" y="120" width="132" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="260" y="134" width="102" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="260" y="150" width="58" height="10" rx="5" fill="#dcfce7"/>
    <rect x="326" y="150" width="38" height="10" rx="5" fill="#e0e7ff"/>
  </g>

  <!-- branch B -->
  <g>
    <rect x="248" y="178" width="172" height="80" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="260" y="190" width="46" height="8" rx="4" fill="#64748b"/>
    <circle cx="398" cy="194" r="5" fill="#f59e0b"/>
    <rect x="260" y="208" width="140" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="260" y="222" width="112" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="260" y="238" width="70" height="10" rx="5" fill="#fef3c7"/>
  </g>

  <!-- compare / promote -->
  <path d="M424 122 C458 122 458 150 488 150" fill="none" stroke="#4d6bfe" stroke-width="2.5"/>
  <path d="M488 150 l-9 -5 v10 z" fill="#4d6bfe"/>
  <rect x="492" y="96" width="104" height="108" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <rect x="506" y="110" width="52" height="8" rx="4" fill="#4338ca"/>
  <rect x="506" y="126" width="76" height="7" rx="3.5" fill="#a5b4fc"/>
  <rect x="506" y="140" width="64" height="7" rx="3.5" fill="#a5b4fc"/>
  <rect x="506" y="160" width="76" height="26" rx="8" fill="url(#accent)"/>
  <path d="M531 173 h16 m-5 -5 5 5 -5 5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="574" cy="234" r="18" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <path d="M566 234 l6 6 12 -13" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
